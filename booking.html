<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Room</title>
<style>   
    body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    text-align:center;
    background-image:url(https://images.unsplash.com/photo-1611892440504-42a792e24d32?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
    background-size: cover;
   
   
}
.head{
    background-color: white;;
    font-size: 2rem;
    color:black;
    margin-top: 10px;
    margin-bottom: 10px;
}
h1{
    font-weight: bold;
    font-size: 2rem;
    background-color: #28a745;
    color:white;
    
   
    padding:10px;
    border-radius: 10px;
}
.h1{
  display: flex;
  justify-content: center;
  align-items: center;
    margin-top: 50px;
   padding-left: 30px;
   margin-right: 30px;
 
}
#booking-form{
    margin-top: 5px;
     
  margin-bottom: 5px;
}

form{
   
    width:350px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}


input{
    width:90%;
    padding:10px;
    margin:5px;
}

button{
    width:95%;
    padding:10px;
    background: #a78328;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
p{
    background-color:#f7fbf8;
    display:inline;
    padding:10px;
    border-radius: 10px;
    
}
.para{
    margin-top: 20px;
}

button:hover{
    background:#218838;
}
.form{
    margin-bottom: 50px;
}
#message{
    color:black;
    font-weight:bolder;
    font-size: 2rem;
}

   
</style>
    
</head>
<body>
<div class="form">
<div class="container"></div>
<div class="h1">
<h1 class="head">Hotel Booking</h1>
</div>
<form id="bookingForm">
    
    <label>Name</label><br>
    <input type="text" id="name" required><br><br>

    <label>Email</label><br>
    <input type="email" id="email" required><br><br>

    <label>Hotel</label><br>
    <input type="text" id="hotell" required><br><br>

    <label>Room</label><br>
    <input type="text" id="room" required><br><br>

    <label>Check-in Date</label><br>
    <input type="date" id="checkin" required><br><br>

    <label>Check-out Date</label><br>
    <input type="date" id="checkout" required><br><br>

    <label>Guests</label><br>
    <input type="number" id="guests" min="1" max="10" required><br><br>

    <label>Total</label><br>
    <input type="number" id="total" required><br><br>

    <button onclick="showdata()" type="submit">Book Now</button>
</form>
</div>
<div class="para">
<p id="message">Fill out this form</p>
</div>

<script>
    function showdata()
    {
    document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault();

  
     const name= document.getElementById("name").value
     const email= document.getElementById("email").value
     const hotel=document.getElementById("hotell").value
     const room= document.getElementById("room").value
     const checkin=document.getElementById("checkin").value
     const checkout=document.getElementById("checkout").value
     const guests=document.getElementById("guests").value
     const total= document.getElementById("total").value


     localStorage.setItem("name",name);
      localStorage.setItem("email",email);
       localStorage.setItem("hotel",hotel);
        localStorage.setItem("room",room);
         localStorage.setItem("checkin",checkin);
          localStorage.setItem("checkout",checkout);
           localStorage.setItem("guests",guests);
            localStorage.setItem("total",total);
   
    

    document.getElementById("message").innerHTML =
    `Thank you, ${name} ! Your booking has been confirmed.`;


      window.location.href = "summary.html";
    
  })};

</script>
</div>
</body>
</html>
